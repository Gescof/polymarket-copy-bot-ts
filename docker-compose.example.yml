# Full stack example with MongoDB
# This example shows how to run the bot with a local MongoDB instance
# For production, consider using a managed MongoDB service like MongoDB Atlas

services:
  mongodb:
    image: mongo:7.0.15-jammy
    container_name: polymarket-mongodb
    restart: unless-stopped
    
    # MongoDB authentication
    # IMPORTANT: Set MONGO_PASSWORD environment variable before running
    # Example: MONGO_PASSWORD=your_secure_password docker compose -f docker-compose.example.yml up -d
    # Or use docker-quickstart.sh which auto-generates a secure password
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD environment variable is required. Set it or use docker-quickstart.sh}
      MONGO_INITDB_DATABASE: polymarket
    
    # Persistent storage for database
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    
    # Expose MongoDB port (optional - only if you need external access)
    # ports:
    #   - "27017:27017"
    
    # Network
    networks:
      - polymarket-network
    
    # Health check
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  polymarket-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-copy-bot
    restart: unless-stopped
    
    # Wait for MongoDB to be healthy before starting
    depends_on:
      mongodb:
        condition: service_healthy
    
    # Environment variables from .env file
    env_file:
      - .env
    
    # Override MONGO_URI to use local MongoDB
    # IMPORTANT: MONGO_PASSWORD environment variable is required
    environment:
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD:?MONGO_PASSWORD environment variable is required}@mongodb:27017/polymarket?authSource=admin
    
    # Volumes for persistent data (uncomment as needed)
    # volumes:
    #   - ./logs:/app/logs
    #   - ./simulation_results:/app/simulation_results
    #   - ./trader_data_cache:/app/trader_data_cache
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "dist/scripts/healthCheck.js"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    
    # Network
    networks:
      - polymarket-network

# Named volumes for persistent data
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

# Network configuration
networks:
  polymarket-network:
    driver: bridge
